name: Deploy NovaLink

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novalink-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://novalinkhub.tech
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint PHP backend
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build production frontend
        run: npm run build

      - name: Assemble minimal release
        run: |
          set -euo pipefail
          mkdir -p release/backend
          cp -a dist/. release/
          cp .htaccess release/.htaccess
          rsync -a \
            --exclude='config/env.php' \
            --exclude='config/env.example.php' \
            --exclude='storage/' \
            --exclude='test*.php' \
            --exclude='*.sql' \
            --exclude='*.md' \
            backend/ release/backend/
          test -f release/index.html
          test -f release/backend/api/health.php
          tar -C release -czf novalink-release.tgz .

      - name: Configure pinned SSH host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 novalink-release.tgz "$ORACLE_USER@$ORACLE_HOST:/tmp/novalink-release.tgz"
          ssh -i ~/.ssh/id_ed25519 "$ORACLE_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          app_root=/var/www/html/novalink
          archive=/tmp/novalink-release.tgz
          tar -xzf "$archive" -C "$app_root"
          rm -f "$archive"
          echo "Deploy complete."
          REMOTE

      - name: Verify production health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://novalinkhub.tech/backend/api/health.php
