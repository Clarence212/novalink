# Oracle Linux 9 / Apache 2.4 production VirtualHost template.
# Replace certificate paths if Certbot uses a different name.

<VirtualHost *:80>
    ServerName novalinkhub.tech
    ServerAlias www.novalinkhub.tech
    Redirect permanent / https://novalinkhub.tech/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName novalinkhub.tech
    ServerAlias www.novalinkhub.tech
    DocumentRoot /var/www/novalink/current

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/novalinkhub.tech/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/novalinkhub.tech/privkey.pem

    <Directory /var/www/novalink/current>
        Options FollowSymLinks
        AllowOverride FileInfo Options
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/novalink/(?:current/backend/(?:config|lib|scripts|services|storage)|shared/backend/storage)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog /var/log/httpd/novalink-error.log
    CustomLog /var/log/httpd/novalink-access.log combined
</VirtualHost>
</IfModule>
